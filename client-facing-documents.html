<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Facing Documents | E3</title>
<meta name="description" content="Client facing documents for the Guided E3 Lab.">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:transparent}
body{font-family:Avenir,"Segoe UI",Arial,sans-serif;color:#354552}
.documents{width:100%;min-height:100vh;display:flex;flex-direction:column;background:#fff;border:1px solid #dce0e3;border-radius:10px;overflow:hidden}
header{padding:17px 20px;background:#354552;color:#fff}
h1{margin:0;font-family:Athelas,Georgia,serif;font-size:22px;line-height:1.25;font-weight:700}
ul{list-style:none;margin:0;padding:8px 14px 12px;flex:1;display:grid;grid-template-rows:repeat(8,minmax(44px,1fr))}
li{display:flex;min-width:0}
li+li{border-top:1px solid #e6e9eb}
a{width:100%;display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:5px;color:#354552;text-decoration:none;font-size:14px;line-height:1.4;font-weight:600}
a span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
a:hover{background:#f1f3f5}
a:focus-visible{outline:2px solid #354552;outline-offset:-2px;background:#f1f3f5}
.arrow{font-size:18px;color:#657480;flex:none}
@media(max-width:360px){header{padding:15px}h1{font-size:20px}ul{padding:6px 8px 10px}a{padding:11px 7px;gap:8px}}
</style>
</head>
<body>
<section class="documents" aria-labelledby="documents-title">
<header><h1 id="documents-title">Client Facing Documents</h1></header>
<ul aria-label="Client documents">
<li><a href="https://www.consultdibona.com/Resources/guided-e3-overview" target="_blank" rel="noopener noreferrer"><span>Guided E3 Lab Overview</span><span class="arrow" aria-hidden="true">↗</span></a></li>
<li><a href="https://www.consultdibona.com/Resources/guided-e3-overview_v2" target="_blank" rel="noopener noreferrer"><span>Guided E3 Lab Overview (with Diagnostic CTA)</span><span class="arrow" aria-hidden="true">↗</span></a></li>
<li><a href="https://www.consultdibona.com/Resources/founding-participant-overview" target="_blank" rel="noopener noreferrer"><span>Founding Participant Overview</span><span class="arrow" aria-hidden="true">↗</span></a></li>
<li><a href="https://www.consultdibona.com/Resources/course-schedule-what-to-expect" target="_blank" rel="noopener noreferrer"><span>Course Schedule and What to expect</span><span class="arrow" aria-hidden="true">↗</span></a></li>
<li><a href="https://www.consultdibona.com/Resources/consultant-bio" target="_blank" rel="noopener noreferrer"><span>Consultant Bio Sheet</span><span class="arrow" aria-hidden="true">↗</span></a></li>

<li><a href="https://www.consultdibona.com/Resources/faq-sheet" target="_blank" rel="noopener noreferrer"><span>FAQ Sheet</span><span class="arrow" aria-hidden="true">↗</span></a></li>
<li><a href="https://www.consultdibona.com/Resources/group-e3-productivity-lab" target="_blank" rel="noopener noreferrer"><span>Company Group E3 Lab</span><span class="arrow" aria-hidden="true">↗</span></a></li>
</ul>
</section>
